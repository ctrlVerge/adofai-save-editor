name: Build & Release

# Triggers:
#   - push to main with "[R]" or "[release]" in commit message -> bump + tag + build + release
#   - push tag v*   -> build + release that exact version
#   - manual run    -> always build + release, optional bump type
on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      bump:
        description: 'Bump type (patch / minor / major)'
        required: false
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  gate:
    name: Check release marker
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
    steps:
      - name: Check
        id: check
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" || "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            SHOULD=true
          elif grep -qE '\[[Rr]elease\]|\[[Rr]\]' <<< "$COMMIT_MSG"; then
            SHOULD=true
          else
            SHOULD=false
          fi
          echo "should_release=$SHOULD" >> "$GITHUB_OUTPUT"

  version:
    name: Resolve version
    needs: gate
    if: needs.gate.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Resolve version
        id: resolve
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            LATEST=$(git describe --tags --abbrev=0 2>/dev/null || sed -nE 's/.*"version": *"([0-9]+\.[0-9]+\.[0-9]+)".*/\1/p' package.json | head -1)
            LATEST="${LATEST#v}"
            IFS='.' read -r MAJOR MINOR PATCH <<< "$LATEST"
            MAJOR=${MAJOR:-0}; MINOR=${MINOR:-0}; PATCH=${PATCH:-0}
            BUMP="patch"
            DISPATCH="${{ github.event.inputs.bump }}"
            if [[ -n "$DISPATCH" ]]; then BUMP="$DISPATCH"; fi
            MSG=$(git log -1 --pretty=%B)
            if grep -q '\[major\]' <<< "$MSG"; then BUMP="major"; fi
            if grep -q '\[minor\]' <<< "$MSG"; then BUMP="minor"; fi
            case "$BUMP" in
              major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
              minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
              *)     PATCH=$((PATCH + 1)) ;;
            esac
            VERSION="$MAJOR.$MINOR.$PATCH"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.os }})
    needs: [gate, version]
    if: needs.gate.outputs.should_release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: dist-windows
          - os: macos-latest
            artifact: dist-macos
          - os: ubuntu-latest
            artifact: dist-linux

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Sync version
        run: |
          VERSION="${{ needs.version.outputs.version }}"
          npm version --no-git-tag-version "$VERSION"
          node -e 'const fs=require("fs");const p="src-tauri/tauri.conf.json";const o=JSON.parse(fs.readFileSync(p,"utf8"));o.version=process.env.VERSION;fs.writeFileSync(p,JSON.stringify(o,null,2)+"\n");'

      - name: Build with Tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload bundles
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: |
            src-tauri/target/release/bundle/**/*.exe
            src-tauri/target/release/bundle/**/*.msi
            src-tauri/target/release/bundle/**/*.dmg
            src-tauri/target/release/bundle/**/*.AppImage
            src-tauri/target/release/bundle/**/*.deb
          if-no-files-found: error

  build-android:
    name: Build (android)
    needs: [gate, version]
    if: needs.gate.outputs.should_release == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Sync version
        run: |
          VERSION="${{ needs.version.outputs.version }}"
          npm version --no-git-tag-version "$VERSION"
          node -e 'const fs=require("fs");const p="src-tauri/tauri.conf.json";const o=JSON.parse(fs.readFileSync(p,"utf8"));o.version=process.env.VERSION;fs.writeFileSync(p,JSON.stringify(o,null,2)+"\n");'

      - name: Install Android Rust targets
        run: rustup target add aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"

      - name: Init Android project
        run: npx tauri android init --ci

      - name: Build APK
        run: npx tauri android build --apk

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: dist-android
          path: |
            src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

  release:
    name: Create Release
    needs: [gate, version, build, build-android]
    if: needs.gate.outputs.should_release == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts
          merge-multiple: true

      - name: Create tag & release
        env:
          GH_TOKEN: ${{ github.token }}
        run: 
          VERSION="${{ needs.version.outputs.version }}"
          mapfile -t FILES < <(find artifacts -type f)
          if [[ ${#FILES[@]} -eq 0 ]]; then
          echo "No artifacts found"
          exit 1
          fi
          echo "Files to upload:"
          printf '  %s\n' "${FILES[@]}"
          if gh release view "v$VERSION" >/dev/null 2>&1; then
          echo "Release v$VERSION already exists, skipping"
          else
          gh release create "v$VERSION" "${FILES[@]}" --title "v$VERSION" --generate-notes
          fi
